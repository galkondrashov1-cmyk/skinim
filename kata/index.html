<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kata — Paper Trading</title>
    <meta name="description" content="Rehearse every trade. Professional paper trading on real-time market data — leverage, stops, journal and analytics, with zero capital at risk." />
    <meta name="theme-color" content="#0C0E11" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="Kata" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kata" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:title" content="Kata — Rehearse every trade" />
    <meta property="og:description" content="Paper trading on live market data. Real prices, simulated money, honest results." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#0C0E11" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--KATA_LAUNCH_IMAGES-->
    <script>
      // Apply theme before first paint.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('kata.ui.v1') || '{}').state || {};
          var t = s.theme || 'system';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
          if (s.palette === 'colorblind') document.documentElement.dataset.palette = 'colorblind';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      /* Launch screen — inline so it paints before any JavaScript loads. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        grid-template-rows: 1fr auto;
        background: #0c0e11;
        color: #ece7dc;
        transition: opacity 260ms cubic-bezier(0.2, 0.7, 0.2, 1), visibility 0s linear 260ms;
        padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 28px);
      }
      #splash.out {
        opacity: 0;
        visibility: hidden;
      }
      .sp-center {
        display: grid;
        place-items: center;
        align-content: center;
        gap: 18px;
      }
      .sp-mark {
        width: 76px;
        height: 76px;
        overflow: visible;
      }
      .sp-mark * {
        stroke: #ece7dc;
        stroke-width: 2.8;
        fill: none;
        stroke-linejoin: miter;
      }
      .sp-mark rect {
        fill: #ece7dc;
        stroke: none;
        transform-origin: 12px 24.5px;
        transform: scaleY(0);
        animation: sp-body 380ms 220ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      .sp-wick {
        stroke-dasharray: 38;
        stroke-dashoffset: 38;
        animation: sp-draw 420ms 40ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .sp-tp,
      .sp-sl {
        stroke-dasharray: 44;
        stroke-dashoffset: 44;
        animation: sp-draw 520ms 520ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .sp-sl {
        animation-delay: 600ms;
      }
      .sp-word {
        height: 17px;
        fill: #ece7dc;
        opacity: 0;
        transform: translateY(4px);
        animation: sp-in 420ms 820ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      .sp-foot {
        display: grid;
        justify-items: center;
        gap: 10px;
        font: 600 10.5px/1 'Barlow Semi Condensed', system-ui, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7f7b73;
      }
      .sp-bar {
        width: 120px;
        height: 1px;
        background: #20252d;
        overflow: hidden;
      }
      .sp-bar i {
        display: block;
        height: 100%;
        width: calc(var(--p, 0.08) * 100%);
        background: #ece7dc;
        transition: width 300ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .sp-step {
        min-height: 12px;
        color: #b3aea4;
        letter-spacing: 0.1em;
      }
      .sp-slogan {
        opacity: 0;
        animation: sp-in 500ms 1000ms ease forwards;
      }
      @keyframes sp-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes sp-body {
        to {
          transform: scaleY(1);
        }
      }
      @keyframes sp-in {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sp-mark *,
        .sp-word,
        .sp-slogan {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Kata is loading">
      <div class="sp-center">
        <!--KATA_SPLASH_MARK-->
        <!--KATA_SPLASH_WORD-->
      </div>
      <div class="sp-foot">
        <div class="sp-bar"><i id="splash-bar"></i></div>
        <div class="sp-step" id="splash-step">Loading</div>
        <div class="sp-slogan">Rehearse every trade</div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>Kata needs JavaScript to run the trading engine.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
